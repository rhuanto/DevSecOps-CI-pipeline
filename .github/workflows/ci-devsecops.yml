# ============================================================
#  PIPELINE DE INTEGRACIÓN CONTINUA — DevSecOps
#  Node.js (Express) → Azure App Service
#  Prácticas: SCA (npm audit) + SAST (ESLint Security)
# ============================================================

name: CI DevSecOps — Node.js Azure

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1 — SCA: Análisis de Composición de Software
  #          Detecta vulnerabilidades en dependencias (npm audit)
  # ──────────────────────────────────────────────────────────
  security-sca:
    name: "🔍 SCA — Auditoría de Dependencias"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 18.x"
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: "📦 Instalar dependencias"
        run: npm ci

      # SCA — npm audit (falla el pipeline si hay vulns HIGH o CRITICAL)
      - name: "🛡️ SCA — npm audit (HIGH + CRITICAL)"
        run: npm audit --audit-level=high
        # Si quieres que el pipeline NO falle sino que solo reporte, cambia a:
        # run: npm audit --audit-level=high || true

      # Genera un reporte JSON de auditoría como artefacto
      - name: "📄 Generar reporte de auditoría (JSON)"
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: "⬆️ Subir reporte de auditoría"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 2 — SAST: Análisis Estático de Seguridad del Código
  #          ESLint + eslint-plugin-security
  # ──────────────────────────────────────────────────────────
  security-sast:
    name: "🔒 SAST — Escaneo Estático del Código"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 18.x"
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: "📦 Instalar dependencias"
        run: npm ci

      # SAST — ESLint con plugin de seguridad
      - name: "🔍 SAST — ESLint Security Scan"
        run: npx eslint . --ext .js --format stylish
        # Para que el pipeline NO falle y solo reporte, agrega: || true

      # Genera reporte SARIF para visualización en GitHub Security tab
      - name: "📄 SAST — Generar reporte SARIF"
        if: always()
        run: |
          npx eslint . --ext .js \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif || true

      - name: "⬆️ Subir resultados SARIF a GitHub Security"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # JOB 3 — TEST: Pruebas unitarias + reporte de cobertura
  # ──────────────────────────────────────────────────────────
  test:
    name: "🧪 Pruebas Unitarias y Cobertura"
    runs-on: ubuntu-latest
    needs: [security-sca, security-sast]

    steps:
      - name: "📥 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 18.x"
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: "📦 Instalar dependencias"
        run: npm ci

      - name: "🧪 Ejecutar tests con cobertura"
        run: npm test

      - name: "⬆️ Subir reporte de cobertura"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 4 — BUILD: Construcción del artefacto para Azure
  # ──────────────────────────────────────────────────────────
  build:
    name: "🏗️ Build — Empaquetado para Azure App Service"
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: "📥 Checkout del código fuente"
        uses: actions/checkout@v4

      - name: "⚙️ Configurar Node.js 18.x"
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      # Instalar solo dependencias de producción
      - name: "📦 Instalar dependencias de producción"
        run: npm ci --omit=dev

      # Comprimir el artefacto listo para Azure
      - name: "📦 Crear artefacto de despliegue (.zip)"
        run: |
          zip -r release.zip . \
            --exclude "*.git*" \
            --exclude "tests/*" \
            --exclude "*.eslintrc*" \
            --exclude "coverage/*" \
            --exclude "*.md"
          echo "✅ Artefacto creado: release.zip"
          ls -lh release.zip

      - name: "⬆️ Subir artefacto de despliegue"
        uses: actions/upload-artifact@v4
        with:
          name: node-app-azure
          path: release.zip
          retention-days: 30

      # Resumen del pipeline en GitHub Actions
      - name: "📋 Resumen del Pipeline CI"
        run: |
          echo "## ✅ Pipeline CI DevSecOps — Completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 SCA (npm audit) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 SAST (ESLint Security) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Pruebas Unitarias | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build Azure | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artefacto:** \`node-app-azure/release.zip\`" >> $GITHUB_STEP_SUMMARY
